    </div>

    <div class="system-status">
      <span class="status-dot"></span>
      Sistema operativo

  </div>

  <main class="dashboard-content">

    </section>

    <section
      class="dashboard-section"
      [routerLink]="['/mission']">

      <app-mission></app-mission>

    </section>
