
@if (mission) {
<div class="mission-form-container">

  <h2>Editar misión</h2>

  <form (ngSubmit)="updateMission()">

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        [(ngModel)]="mission.nombre"
        name="nombre"
      >
    </div>

    <div class="form-group">
      <label for="estado">Estado</label>
      <input
        id="estado"
        type="text"
        [(ngModel)]="mission.estado"
        name="estado"
      >
    </div>

    <div class="form-group">
      <label for="destino">Destino</label>
      <input
        id="destino"
        type="text"
        [(ngModel)]="mission.destino"
        name="destino"
      >
    </div>

    <div class="form-group">
      <label for="fechaInicio">Fecha de inicio</label>
      <input
        id="fechaInicio"
        type="date"
        [(ngModel)]="mission.fechaInicio"
        name="fechaInicio"
      >
    </div>

    <div class="form-group">
      <label for="fechaFin">Fecha de fin</label>
      <input
        id="fechaFin"
        type="date"
        [(ngModel)]="mission.fechaFin"
        name="fechaFin"
      >
    </div>

    <button type="submit">
      Guardar cambios
    </button>

  </form>

  <button
    type="button"
    (click)="deleteMission()">
    Eliminar misión
  </button>

</div>

}
