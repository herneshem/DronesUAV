<h2>Editar waypoint</h2>

@if (waypoint) {

  <form (ngSubmit)="updateWaypoint()">

    <div class="form-group">
      <label for="latitud">Latitud</label>

      <input
        id="latitud"
        type="number"
        step="any"
        [(ngModel)]="waypoint.latitud"
        name="latitud"
        required
      >
    </div>


    <div class="form-group">
      <label for="longitud">Longitud</label>

      <input
        id="longitud"
        type="number"
        step="any"
        [(ngModel)]="waypoint.longitud"
        name="longitud"
        required
      >
    </div>


    <div class="form-group">
      <label for="altitud">Altitud</label>

      <input
        id="altitud"
        type="number"
        [(ngModel)]="waypoint.altitud"
        name="altitud"
        required
      >
    </div>


    <button type="submit">
      Guardar cambios
    </button>

    <button
      type="button"
      (click)="deleteWaypoint()">
      Eliminar waypoint
    </button>

  </form>

} @else {

  <p>Cargando waypoint...</p>

}
